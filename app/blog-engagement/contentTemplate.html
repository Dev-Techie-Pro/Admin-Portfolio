<div class="pa-header-page">
  <div class="pa-header-page-left">
    <button class="pa-mobile-toggle" id="paMobileToggle" aria-label="Toggle menu"><i class="ri-menu-line"></i></button>
    <div class="pa-header-title-block">
      <span class="pa-header-accent" aria-hidden="true"></span>
      <div class="pa-header-left">
        <div class="pa-page-title">Comments &amp; Likes</div>
        <div class="pa-page-subtitle">Moderate blog comments and review like activity across your posts</div>
      </div>
    </div>
  </div>
  <div class="pa-header-page-right">
    <button class="pa-btn-add" id="paBlogEngExportBtn" type="button">
      <i class="ri-download-2-line"></i> <span>Export Comments</span>
    </button>
  </div>
</div>

<div class="pa-beng">
  <nav class="pa-beng-tabs" id="paBlogEngMainTabs" role="tablist" aria-label="Engagement view">
    <button type="button" class="pa-beng-tab is-active" data-eng-main-tab="comments" role="tab" aria-selected="true">
      <i class="ri-chat-3-line" aria-hidden="true"></i><span>Comments</span>
    </button>
    <button type="button" class="pa-beng-tab" data-eng-main-tab="likes" role="tab" aria-selected="false">
      <i class="ri-thumb-up-line" aria-hidden="true"></i><span>Likes</span>
    </button>
  </nav>

  <div class="pa-beng-stats" id="paBlogEngStatsRow">
    <div class="pa-beng-stat pa-beng-stat--orange">
      <i class="ri-chat-3-line" aria-hidden="true"></i>
      <div><span class="pa-beng-stat-label">Comments</span><strong class="pa-beng-stat-value" id="paBlogEngStatTotal">0</strong></div>
    </div>
    <div class="pa-beng-stat pa-beng-stat--blue">
      <i class="ri-time-line" aria-hidden="true"></i>
      <div><span class="pa-beng-stat-label">Pending</span><strong class="pa-beng-stat-value" id="paBlogEngStatPending">0</strong></div>
    </div>
    <div class="pa-beng-stat pa-beng-stat--green">
      <i class="ri-check-double-line" aria-hidden="true"></i>
      <div><span class="pa-beng-stat-label">Approved</span><strong class="pa-beng-stat-value" id="paBlogEngStatApproved">0</strong></div>
    </div>
    <div class="pa-beng-stat pa-beng-stat--purple">
      <i class="ri-thumb-up-line" aria-hidden="true"></i>
      <div><span class="pa-beng-stat-label">Likes</span><strong class="pa-beng-stat-value" id="paBlogEngStatLikes">0</strong></div>
    </div>
  </div>

  <div class="pa-beng-pane" id="paBlogEngPaneComments" data-eng-pane="comments">
    <div class="pa-beng-shell">
      <div class="pa-beng-filter-bar">
        <div class="pa-beng-chips" role="tablist" aria-label="Filter comments by status">
          <button type="button" class="pa-beng-chip is-active" data-status="all" role="tab" aria-selected="true">All</button>
          <button type="button" class="pa-beng-chip" data-status="pending" role="tab" aria-selected="false">Pending</button>
          <button type="button" class="pa-beng-chip" data-status="approved" role="tab" aria-selected="false">Approved</button>
          <button type="button" class="pa-beng-chip" data-status="rejected" role="tab" aria-selected="false">Rejected</button>
          <button type="button" class="pa-beng-chip" data-status="spam" role="tab" aria-selected="false">Spam</button>
        </div>
        <div class="pa-beng-filter-row">
          <select class="pa-filter-select" id="paBlogEngStatusFilter" aria-label="Filter by status">
            <option value="all">All status</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
            <option value="spam">Spam</option>
          </select>
          <select class="pa-filter-select" id="paBlogEngTimeFilter" aria-label="Filter by time">
            <option value="all">All time</option>
            <option value="today">Today</option>
            <option value="week">This week</option>
            <option value="month">This month</option>
          </select>
          <select class="pa-filter-select" id="paBlogEngPostFilter" aria-label="Filter by post">
            <option value="all">All posts</option>
          </select>
          <label class="pa-beng-search">
            <i class="ri-search-line" aria-hidden="true"></i>
            <input type="search" placeholder="Search author, email, or comment…" id="paBlogEngToolbarSearch" aria-label="Search comments" />
          </label>
          <button type="button" class="pa-beng-icon-btn" id="paBlogEngSelectModeBtn" title="Select multiple" aria-label="Select multiple comments">
            <i class="ri-checkbox-multiple-line"></i>
          </button>
        </div>
      </div>

      <div class="pa-toolbar pa-med-up-toolbar" id="paBlogEngBulkBar" style="display:none;">
        <span class="pa-tag" id="paBlogEngBulkCount">0 selected</span>
        <div class="pa-toolbar-spacer"></div>
        <button type="button" class="pa-btn pa-btn-cancel" id="paBlogEngBulkSelectAll">Select all</button>
        <button type="button" class="pa-btn pa-btn-cancel" id="paBlogEngBulkClear">Clear</button>
        <button type="button" class="pa-btn pa-btn-cancel" id="paBlogEngBulkApproveBtn"><i class="ri-check-line"></i> Approve</button>
        <button type="button" class="pa-btn pa-btn-danger" id="paBlogEngBulkSpamBtn"><i class="ri-spam-2-line"></i> Mark spam</button>
      </div>

      <div class="pa-beng-workspace">
        <div class="pa-beng-main">
          <div class="pa-beng-feed" id="paBlogEngFeed" aria-live="polite" aria-label="Comments list"></div>
          <footer class="pa-beng-pager">
            <div class="pa-pagination-btns" id="paBlogEngPaginationBtns"></div>
            <p class="pa-beng-pager-meta" id="paBlogEngPaginationInfo"></p>
          </footer>
        </div>
        <aside class="pa-beng-aside" id="paBlogEngDetailPanel">
          <header class="pa-beng-aside-head">
            <h2 class="pa-beng-aside-title">Moderation</h2>
            <div class="pa-beng-aside-head-actions">
              <button type="button" class="pa-beng-icon-btn danger" id="paBlogEngDetailDelete" title="Delete comment" aria-label="Delete comment"><i class="ri-delete-bin-line"></i></button>
              <button type="button" class="pa-beng-icon-btn" id="paBlogEngDetailClose" title="Clear selection" aria-label="Clear selection"><i class="ri-close-line"></i></button>
            </div>
          </header>
          <div class="pa-beng-aside-body" id="paBlogEngDetailBody">
            <div class="pa-beng-aside-empty">
              <i class="ri-chat-smile-3-line" aria-hidden="true"></i>
              <p class="pa-beng-aside-empty-title">No comment selected</p>
              <p class="pa-beng-aside-empty-text">Pick a comment from the feed to review and moderate it here.</p>
            </div>
          </div>
          <footer class="pa-beng-aside-foot" id="paBlogEngDetailFooter"></footer>
        </aside>
      </div>
    </div>
  </div>

  <div class="pa-beng-pane pa-beng-pane--hidden" id="paBlogEngPaneLikes" data-eng-pane="likes">
    <div class="pa-beng-shell">
      <div class="pa-beng-likes-toolbar">
        <div class="pa-beng-likes-intro">
          <p class="pa-beng-likes-meta" id="paBlogEngLikesMeta">Like counts and engagement settings per post</p>
        </div>
        <div class="pa-view-toggle pa-beng-likes-view-toggle" role="group" aria-label="Likes view mode">
          <button type="button" class="pa-view-btn active" id="paBlogEngLikesGridViewBtn" title="Grid view" aria-label="Grid view"><i class="ri-layout-grid-fill"></i></button>
          <button type="button" class="pa-view-btn" id="paBlogEngLikesListViewBtn" title="List view" aria-label="List view"><i class="ri-list-unordered"></i></button>
        </div>
      </div>
      <div class="pa-beng-likes-grid" id="paBlogEngLikesGrid" aria-live="polite" aria-label="Posts with like counts"></div>
      <footer class="pa-beng-pager pa-beng-likes-pager">
        <div class="pa-pagination-btns" id="paBlogEngLikesPaginationBtns"></div>
        <p class="pa-beng-pager-meta" id="paBlogEngLikesPaginationInfo"></p>
      </footer>
    </div>
  </div>
</div>
